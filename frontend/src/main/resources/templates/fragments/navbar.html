<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar">
    <div class="container-fluid px-4">

        <!-- Oeffnet unter lg die Sidebar als Offcanvas. -->
        <button class="navbar-toggler d-lg-none me-3" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar" aria-label="Navigation anzeigen">
            <span class="navbar-toggler-icon"></span>
        </button>

        <a class="navbar-brand wordmark me-auto" th:href="@{/dashboard}"><span>CV</span>Portal</a>

        <div class="dropdown" th:if="${currentUser != null}">
            <button class="btn btn-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar" aria-hidden="true"
                      th:text="${#strings.toUpperCase(#strings.substring(currentUser.username, 0, 1))}">M</span>
                <span th:text="${currentUser.username}">Benutzer</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <!-- Logout muss POST sein, sonst lehnt der CSRF-Schutz ab. -->
                    <form th:action="@{/logout}" method="post">
                        <button class="dropdown-item" type="submit">Abmelden</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
