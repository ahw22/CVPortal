<!DOCTYPE html>
<html lang="de" data-bs-theme="deepocean" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lebenslauf')}"></head>
<body>

<main class="container py-5" style="max-width: 820px">

    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h1 th:text="|${cv.firstName ?: ''} ${cv.lastName ?: ''}|">Name</h1>
            <div style="color: var(--c-accent-soft)" th:text="${cv.jobTitle}">Beruf</div>
            <div class="small text-body-secondary mt-1">
                <span th:if="${cv.email != null}" th:text="${cv.email}"></span>
                <span th:if="${cv.phone != null}" th:text="' · ' + ${cv.phone}"></span>
                <span th:if="${cv.address != null}" th:text="' · ' + ${cv.address}"></span>
            </div>
        </div>
        <button class="btn btn-secondary btn-sm no-print" onclick="window.print()">Drucken</button>
    </div>

    <p th:if="${cv.summary != null}" th:text="${cv.summary}">Kurzprofil</p>

    <section class="mt-5" th:unless="${cv.workExperiences.isEmpty()}">
        <h2 class="h6 text-body-secondary mb-3">Berufserfahrung</h2>
        <div class="border-bottom py-2" th:each="e : ${cv.workExperiences}">
            <div class="d-flex justify-content-between">
                <strong th:text="${e.position}">Position</strong>
                <span class="small text-body-secondary"
                      th:text="${e.startDate} + ' – ' + (${e.endDate} ?: 'heute')">Zeitraum</span>
            </div>
            <div class="small" th:text="${e.company}">Firma</div>
            <p class="small text-body-secondary mb-0" th:text="${e.description}"></p>
        </div>
    </section>

    <section class="mt-5" th:unless="${cv.educations.isEmpty()}">
        <h2 class="h6 text-body-secondary mb-3">Ausbildung</h2>
        <div class="border-bottom py-2" th:each="a : ${cv.educations}">
            <div class="d-flex justify-content-between">
                <strong th:text="${a.degree}">Abschluss</strong>
                <span class="small text-body-secondary"
                      th:text="${a.startDate} + ' – ' + (${a.endDate} ?: 'heute')">Zeitraum</span>
            </div>
            <div class="small" th:text="${a.institution} + ' · ' + ${a.fieldOfStudy}">Institution</div>
        </div>
    </section>

    <section class="mt-5" th:unless="${cv.skills.isEmpty()}">
        <h2 class="h6 text-body-secondary mb-3">Kenntnisse</h2>
        <span class="pill pill-info me-2 mb-2" th:each="k : ${cv.skills}"
              th:text="${k.name} + ' · ' + ${k.level}">Kenntnis</span>
    </section>

    <section class="mt-5" th:unless="${cv.languages.isEmpty()}">
        <h2 class="h6 text-body-secondary mb-3">Sprachen</h2>
        <span class="pill pill-info me-2 mb-2" th:each="s : ${cv.languages}"
              th:text="${s.language} + ' · ' + ${s.level}">Sprache</span>
    </section>

    <p class="small text-body-secondary mt-5 no-print">
        <a th:href="@{/card/{u}(u=${cv.username})}">Zur Visitenkarte</a>
    </p>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
