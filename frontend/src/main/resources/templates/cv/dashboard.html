<!DOCTYPE html>
<html lang="de" data-bs-theme="deepocean" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>

<main class="container py-5">
    <h1>Dashboard</h1>
    <p class="text-body-secondary">Platzhalter - wird in Phase 5 aufgebaut.</p>

    <!-- Logout muss POST sein: bei aktivem CSRF lehnt Spring Security GET /logout ab.
         Thymeleaf haengt das versteckte CSRF-Feld an jedes th:action-Formular. -->
    <form th:action="@{/logout}" method="post" class="mt-4">
        <button class="btn btn-secondary" type="submit">Abmelden</button>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
