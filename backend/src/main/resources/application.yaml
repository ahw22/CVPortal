server:
  port: 8080

spring:
  application:
    name: cvportal-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          # Springboot baut draus einene JwtAuthenticationConverter.
          # Der Claim "role" wird zur Authority "ROLE_ADMIN" bzw "ROLE_TEILNEHMER"
          # damit hasRole(...) greift.
          authorities-claim-name: role
          authority-prefix: ROLE_

  datasource:
    url: jdbc:h2:file:./data/cvportal
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${CVPORTAL_JWT_SECRET:entwicklungsschluessel-bitte-aendern-min-32-zeichen}
    expiration-hours: 8
  cors:
    allowed-origins: http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG